<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnlyFans Models Directory — FreeOF</title>
  <meta name="description" content="Discover top OnlyFans models on FreeOF and watch their leaked packs and videos in one place.">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://freeof.pages.dev/onlyf.html" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkbg: "#0f0f0f",
            darknav: "#181818",
            accent: "#3b82f6",
            card: "#111827",
            borderPink: "#ff007f",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen font-sans">

  <nav class="bg-darknav border-b border-gray-800 px-4 sm:px-6 py-3 flex items-center justify-between fixed top-0 w-full z-50">
    <div class="flex items-center space-x-3">
      <button class="text-gray-300 hover:text-white sm:hidden" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.75 5.25h16.5m-16.5 6h16.5m-16.5 6h16.5" />
        </svg>
      </button>
      <a href="/" class="text-xl font-semibold text-white">
        free<span class="text-blue-500">OF</span>
      </a>
      <ul class="hidden sm:flex space-x-5 text-sm ml-4">
        <li class="hover:text-blue-400 cursor-pointer"><a href="/">Videos</a></li>
        <li class="text-blue-400 cursor-pointer"><a href="/onlyf.html">Models</a></li>
      </ul>
    </div>
  </nav>

  <main class="pt-24 pb-10">
    <header class="max-w-5xl mx-auto px-4 sm:px-0 mb-6">
      <h1 class="text-3xl font-bold mb-2">OnlyFans Models</h1>
      <p class="text-sm text-gray-400">Browse our directory of OnlyFans models and open their full leaked packs.</p>
    </header>

    <section id="modelsList" class="max-w-5xl mx-auto px-0 space-y-5">
      <!-- Cards here -->
    </section>

    <div class="flex justify-center items-center space-x-2 mt-8">
      <button id="prevBtn" class="px-3 py-1 rounded bg-gray-900 text-gray-300 hover:bg-blue-600 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed">
        &lt;
      </button>
      <span id="pageNumber" class="px-3 py-1 rounded bg-blue-600 text-white">1</span>
      <button id="nextBtn" class="px-3 py-1 rounded bg-gray-900 text-gray-300 hover:bg-blue-600 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed">
        &gt;
      </button>
    </div>
  </main>

  <script>
    const PAGE_LIMIT = 12;
    let currentPage = 1;

    async function loadModels() {
      const container = document.getElementById('modelsList');
      const pageSpan = document.getElementById('pageNumber');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      container.innerHTML = '<p class="text-gray-400 px-4 sm:px-0">Loading models…</p>';

      try {
        const params = new URLSearchParams({
          page: String(currentPage),
          limit: String(PAGE_LIMIT),
          sort: "recent"
        });

        const res = await fetch('/api/models?' + params.toString());
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        const items = Array.isArray(data) ? data : (data.items || []);
        const hasMore = !!(data.hasMore ?? (items.length === PAGE_LIMIT));

        if (!items.length) {
          container.innerHTML = '<p class="text-gray-400 px-4 sm:px-0">No models found.</p>';
          pageSpan.textContent = currentPage;
          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = false;
          return;
        }

        container.innerHTML = "";

        items.forEach(m => {
          const slug = m.slug || "";
          const name = m.display_name || slug || "Unknown model";
          const avatar = m.avatar_url || m.banner_url || "";

          const card = document.createElement("a");
          card.href = "/model.html?slug=" + encodeURIComponent(slug);
          card.className = "block max-w-5xl mx-auto rounded-3xl overflow-hidden bg-card border border-pink-500/70";

          card.innerHTML = `
            <div class="w-full bg-black">
              <img src="${avatar}" alt="${name}" class="w-full object-cover" style="max-height: 420px;">
            </div>
            <div class="px-4 py-3">
              <p class="text-lg font-semibold text-pink-400">${name}</p>
            </div>
          `;

          container.appendChild(card);
        });

        pageSpan.textContent = currentPage;
        prevBtn.disabled = currentPage <= 1;
        prevBtn.classList.toggle('opacity-40', prevBtn.disabled);

        nextBtn.disabled = !hasMore;
        nextBtn.classList.toggle('opacity-40', nextBtn.disabled);
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-gray-400 px-4 sm:px-0">Failed to load models.</p>';
      }
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentPage++;
      loadModels();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadModels();
      }
    });

    loadModels();
  </script>
</body>
</html>
