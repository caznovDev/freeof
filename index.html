<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch and download high quality porn</title>
  <meta name="description" content="Browse random high quality porn videos and OnlyFans leaks on ErroTube-style Playtube clone." />
  <meta name="referrer" content="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkbg: "#0f0f0f",
            darknav: "#181818",
            accent: "#3b82f6",
            card: "#111827"
          },
        },
      },
    };
  </script>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen font-sans">

  <!-- Navbar -->
  <nav class="bg-darknav border-b border-gray-800 px-4 sm:px-6 py-3 flex items-center justify-between fixed top-0 w-full z-50">
    <div class="flex items-center space-x-3">
      <button class="text-gray-300 hover:text-white sm:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5m-16.5 6h16.5m-16.5 6h16.5" />
        </svg>
      </button>
      <a href="/" class="text-xl font-semibold text-white">
        play<span class="text-blue-500">tube</span>
      </a>
      <ul class="hidden sm:flex space-x-5 text-sm ml-4">
        <li class="hover:text-blue-400 cursor-pointer"><a href="/">Porn Videos</a></li>
        <li class="hover:text-blue-400 cursor-pointer"><a href="/onlyf.html">Models</a></li>
      </ul>
    </div>

  </nav>

  <!-- Main -->
  <main class="pt-24 pb-10">
    <div class="flex items-center justify-between mb-6 px-4 sm:px-0 max-w-6xl mx-auto">
      <h2 class="text-2xl font-semibold">Random Videos</h2>
      <div class="flex bg-gray-800 rounded-full p-1 text-xs sm:text-sm">
        <button class="bg-blue-600 text-white rounded-full px-4 py-1">Random</button>
      </div>
    </div>

    <!-- Video Grid -->
    <section class="w-full">
      <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-w-6xl mx-auto px-0"></div>
    </section>

    <!-- Pagination -->
    <div class="flex justify-center items-center space-x-2 mt-8">
      <button id="prevBtn" class="px-3 py-1 rounded bg-gray-900 text-gray-300 hover:bg-blue-600 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed">&lt;</button>
      <span id="pageNumber" class="px-3 py-1 rounded bg-blue-600 text-white">1</span>
      <button id="nextBtn" class="px-3 py-1 rounded bg-gray-900 text-gray-300 hover:bg-blue-600 hover:text-white disabled:opacity-40 disabled:cursor-not-allowed">&gt;</button>
    </div>
  </main>

  <script>
    const PAGE_LIMIT = 20;
    let currentPage = 1;

    async function loadVideos() {
      const grid = document.getElementById("videoGrid");
      const pageSpan = document.getElementById("pageNumber");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      grid.innerHTML = '<p class="text-gray-400 px-4 sm:px-0">Loading videos...</p>';

      try {
        const params = new URLSearchParams({
          page: String(currentPage),
          limit: String(PAGE_LIMIT),
        });

        const res = await fetch("/api/videos/random?" + params.toString());
        if (!res.ok) throw new Error("API error");
        const data = await res.json();
        const items = Array.isArray(data) ? data : (data.items || []);

        if (!items.length) {
          grid.innerHTML = '<p class="text-gray-400 px-4 sm:px-0">No videos found.</p>';
          pageSpan.textContent = currentPage;
          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = true;
          return;
        }

        grid.innerHTML = "";

        items.forEach(v => {
          const title = v.title || "Untitled";
          const thumb = v.thumbnail_url || "";
          const modelName = v.model_name || "";
          const id = v.id;

          grid.insertAdjacentHTML("beforeend", `
            <a href="watch.html?id=${id}" class="block bg-[#111827] rounded-2xl overflow-hidden hover:scale-[1.02] transition">
              <img src="${thumb}" alt="${title}" class="w-full h-44 object-cover">
              <div class="p-3">
                <h3 class="text-sm font-semibold leading-tight">${title}</h3>
                ${modelName ? `<p class="text-xs text-gray-400 mt-1">${modelName}</p>` : ""}
              </div>
            </a>
          `);
        });

        pageSpan.textContent = currentPage;
        prevBtn.disabled = currentPage <= 1;
        prevBtn.classList.toggle("opacity-40", prevBtn.disabled);

        const hasMore = items.length === PAGE_LIMIT;
        nextBtn.disabled = !hasMore;
        nextBtn.classList.toggle("opacity-40", nextBtn.disabled);
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p class="text-gray-400 px-4 sm:px-0">Failed to load videos.</p>';
      }
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentPage++;
      loadVideos();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        loadVideos();
      }
    });

    loadVideos();
  </script>
</body>
</html>
