<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Video — ErroTube</title>
  <meta name="referrer" content="no-referrer">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkbg: "#0f0f0f",
            darknav: "#181818",
            card: "#111827",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen">
  <nav class="bg-darknav border-b border-gray-800 px-4 sm:px-6 py-3 flex items-center justify-between fixed top-0 w-full z-50">
    <a href="/" class="text-xl font-semibold text-white">
      play<span class="text-blue-500">tube</span>
    </a>
    <a href="/onlyf.html" class="text-gray-400 hover:text-blue-400 text-sm">Models</a>
  </nav>

  <main class="pt-24 pb-10 max-w-6xl mx-auto px-4 sm:px-0">
    <section id="videoSection" class="mb-8">
      <p class="text-gray-400">Loading video…</p>
    </section>

    <section class="mt-6">
      <h2 class="text-lg font-semibold mb-3">More from this model</h2>
      <div id="relatedGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </section>
  </main>

  <script>
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    async function loadVideoPage() {
      const id = getQueryParam("id");
      const videoSection = document.getElementById("videoSection");
      const relatedGrid = document.getElementById("relatedGrid");

      if (!id) {
        videoSection.innerHTML = "<p class='text-red-400'>Missing video id.</p>";
        return;
      }

      try {
        const res = await fetch("/api/videos?id=" + encodeURIComponent(id));
        if (!res.ok) throw new Error("API error");
        const raw = await res.json();
        const video = Array.isArray(raw) ? raw[0] : (raw.items && raw.items[0]) || raw;

        if (!video || !video.id) {
          videoSection.innerHTML = "<p class='text-red-400'>Video not found.</p>";
          return;
        }

        const title = video.title || "Untitled video";
        const src = video.video_url || "";
        const thumb = video.thumbnail_url || "";
        const modelName = video.model_name || "";
        const modelId = video.model_id;

        document.title = `${title} — ErroTube`;

        videoSection.innerHTML = `
          <div class="mb-3">
            <h1 class="text-2xl font-semibold mb-2">${title}</h1>
            ${modelName ? `<p class="text-sm text-gray-400">${modelName}</p>` : ""}
          </div>
          <video controls preload="metadata" poster="${thumb}" class="w-full rounded-xl bg-black">
            <source src="${src}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;

        // related
        if (!modelId) {
          relatedGrid.innerHTML = "<p class='text-gray-400 text-sm col-span-full'>No related videos.</p>";
          return;
        }

        const relRes = await fetch("/api/videos?model_id=" + encodeURIComponent(modelId) + "&limit=40&page=1&sort=recent");
        if (!relRes.ok) throw new Error("Related API error");
        const relRaw = await relRes.json();
        let items = Array.isArray(relRaw) ? relRaw : (relRaw.items || []);

        items = items.filter(v => v.id !== video.id);
        if (!items.length) {
          relatedGrid.innerHTML = "<p class='text-gray-400 text-sm col-span-full'>No related videos.</p>";
          return;
        }

        items.sort(() => Math.random() - 0.5);
        items = items.slice(0, 8);

        relatedGrid.innerHTML = "";
        items.forEach(v => {
          const t = v.title || "Untitled";
          const th = v.thumbnail_url || "";
          relatedGrid.insertAdjacentHTML("beforeend", `
            <a href="watch.html?id=${v.id}" class="block bg-card rounded-xl overflow-hidden hover:scale-[1.02] transition">
              <img src="${th}" class="w-full h-24 object-cover" alt="${t}">
              <div class="p-2">
                <p class="text-[11px] font-semibold line-clamp-2">${t}</p>
              </div>
            </a>
          `);
        });
      } catch (err) {
        console.error(err);
        videoSection.innerHTML = "<p class='text-red-400'>Failed to load video.</p>";
      }
    }

    loadVideoPage();
  </script>
</body>
</html>
